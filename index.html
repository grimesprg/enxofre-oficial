<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enxofre Craft — Loja oficial do servidor de Minecraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {

    --text: #e8efe9; --muted: #8fa097; --emerald: #2ee59d; --lava: #ff7a1a; --danger: #ff5d5d;
    --radius: 14px;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  .container { width: min(1120px, 100% - 32px); margin-inline: auto; }

  .muted { color: var(--muted); }

  header { position: sticky; top: 0; z-index: 10; background: rgba(13,15,14,.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }

  .logo span { color: var(--emerald); }
  nav ul { display: flex; gap: 24px; list-style: none; }
  nav a { color: var(--muted); font-size: .95rem; transition: color .2s; }
  nav a:hover { color: var(--text); }
  .nav-actions { display: flex; gap: 10px; }
  .btn { display: inline-block; padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: .92rem; cursor: pointer; border: 1px solid transparent; font-family: inherit; transition: transform .15s, background .2s, border-color .2s; text-align: center; }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--emerald); color: #04130c; }
  .btn-primary:hover { background: #5bf0b6; }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--text); }
  .btn-ghost:hover { border-color: var(--emerald); }
  .btn-danger { background: transparent; border-color: rgba(255,93,93,.5); color: var(--danger); }
  .btn-danger:hover { background: rgba(255,93,93,.1); }
  .btn-sm { padding: 6px 12px; font-size: .82rem; }
  .btn-lg { padding: 14px 28px; font-size: 1rem; }

  .hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .45; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 5%, rgba(13,15,14,.6) 55%, rgba(13,15,14,.25)); }
  .hero .content { position: relative; z-index: 1; padding: 80px 0; max-width: 640px; }
  .eyebrow { display: inline-block; font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--emerald); border: 1px solid rgba(46,229,157,.35); padding: 4px 12px; border-radius: 999px; margin-bottom: 20px; }
  .hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.1; margin-bottom: 18px; }
  .hero h1 em { font-style: normal; color: var(--lava); }
  .hero p { color: #b9c7bf; font-size: 1.08rem; margin-bottom: 32px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-top: -48px; position: relative; z-index: 2; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 20px; text-align: center; }
  .stat strong { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 1.9rem; color: var(--emerald); }
  .stat span { color: var(--muted); font-size: .9rem; }

  section.block { padding: 88px 0 24px; }
  .section-head { margin-bottom: 32px; }
  .section-head h2 { font-size: 1.9rem; }
  .section-head p { color: var(--muted); }
  .cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
  .cat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 22px; transition: border-color .2s, transform .2s; }
  .cat:hover { border-color: var(--emerald); transform: translateY(-3px); }
  .cat .icon { font-size: 1.8rem; margin-bottom: 12px; }
  .cat h3 { font-size: 1.1rem; margin-bottom: 4px; }
  .cat p { color: var(--muted); font-size: .88rem; }

  .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .product { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: grid; gap: 10px; align-content: start; transition: border-color .2s, transform .2s; }
  .product:hover { border-color: var(--lava); transform: translateY(-3px); }
  .product .tag { justify-self: start; font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--lava); border: 1px solid rgba(255,122,26,.4); padding: 2px 10px; border-radius: 999px; }
  .product p { color: var(--muted); font-size: .9rem; }
  .price { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; color: var(--emerald); }

  footer { margin-top: 96px; border-top: 1px solid var(--border); background: var(--bg-2); padding: 56px 0 28px; }
  .foot-grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 32px; }
  footer h4 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 14px; font-size: 1rem; }
  footer ul { list-style: none; display: grid; gap: 8px; }
  footer li a, footer p { color: var(--muted); font-size: .92rem; }
  footer li a:hover { color: var(--emerald); }
